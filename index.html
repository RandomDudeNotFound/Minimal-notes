<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Notes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for notes list -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Notes</h2>
                <div class="actions">
                    <button id="new-note-btn" title="Create New Note">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <label for="import-file" class="icon-btn" title="Import File">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </label>
                    <input type="file" id="import-file" accept=".txt,.md,.docx,.doc" style="display: none;">
                </div>
            </div>
            <div class="notes-list" id="notes-list">
                <!-- Note items will be injected here -->
            </div>
        </aside>

        <!-- Main editor area -->
        <main class="editor-area">
            <div id="editor-empty-state" class="empty-state">
                <p>Select a note or create a new one to start writing.</p>
            </div>
            
            <div id="editor-content" class="editor-content hidden">
                <header class="editor-header">
                    <input type="text" id="note-title" placeholder="Note Title..." autocomplete="off">
                    <button id="delete-note-btn" class="danger-btn" title="Delete Note">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </header>
                <div id="editor-container"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
